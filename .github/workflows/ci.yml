name: CI

on:
  push:
    branches: [main, "claude/**"]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    # Docs-only changes are checked by docs-check.yml instead.
    paths-ignore: ["docs/**", "**.md"]

# A new push to a branch supersedes the run still in progress for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Ubuntu 24.04 has no SDL3 packages; build from source and cache the prefix.
  SDL_TAG: release-3.4.12
  SDL_IMAGE_TAG: release-3.2.4
  SDL_PREFIX: /home/runner/sdl-install
  CPM_SOURCE_CACHE: /home/runner/.cache/cpm

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Same version as the nix dev shell. Versions disagree on formatting,
      # so an unpinned one fails code that `just fmt` produced.
      - name: Check clang-format
        run: |
          find src tests -name '*.cpp' -o -name '*.hpp' \
            | xargs pipx run --spec clang-format==21.1.8 clang-format --dry-run --Werror

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config clang-tidy \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev \
            libegl1-mesa-dev libgl1-mesa-dev libasound2-dev libpulse-dev libudev-dev

      - name: Cache SDL3 install
        id: cache-sdl
        uses: actions/cache@v4
        with:
          path: ${{ env.SDL_PREFIX }}
          key: sdl-${{ env.SDL_TAG }}-${{ env.SDL_IMAGE_TAG }}-${{ runner.os }}-24.04

      - name: Build SDL3 from source
        if: steps.cache-sdl.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$SDL_TAG" https://github.com/libsdl-org/SDL.git /tmp/SDL
          cmake -S /tmp/SDL -B /tmp/SDL/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$SDL_PREFIX" \
            -DSDL_TEST_LIBRARY=OFF -DSDL_EXAMPLES=OFF
          ninja -C /tmp/SDL/build install

          git clone --depth 1 --branch "$SDL_IMAGE_TAG" https://github.com/libsdl-org/SDL_image.git /tmp/SDL_image
          cmake -S /tmp/SDL_image -B /tmp/SDL_image/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$SDL_PREFIX" \
            -DCMAKE_PREFIX_PATH="$SDL_PREFIX" \
            -DSDLIMAGE_SAMPLES=OFF -DSDLIMAGE_TESTS=OFF \
            -DSDLIMAGE_AVIF=OFF -DSDLIMAGE_WEBP=OFF -DSDLIMAGE_TIF=OFF -DSDLIMAGE_JXL=OFF
          ninja -C /tmp/SDL_image/build install

      - name: Cache CPM packages
        uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/CPM.cmake') }}

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_PREFIX_PATH="$SDL_PREFIX"
        env:
          PKG_CONFIG_PATH: ${{ env.SDL_PREFIX }}/lib/pkgconfig

      - name: Run clang-tidy
        run: |
          # Headers are checked through the sources that include them
          # (HeaderFilterRegex in .clang-tidy), not as files of their own.
          find src -name '*.cpp' -print0 \
            | xargs -0 -n 4 -P "$(nproc)" clang-tidy -p build --quiet --warnings-as-errors='*'

  build-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev \
            libegl1-mesa-dev libgl1-mesa-dev libasound2-dev libpulse-dev libudev-dev

      - name: Cache SDL3 install
        id: cache-sdl
        uses: actions/cache@v4
        with:
          path: ${{ env.SDL_PREFIX }}
          key: sdl-${{ env.SDL_TAG }}-${{ env.SDL_IMAGE_TAG }}-${{ runner.os }}-24.04

      - name: Build SDL3 from source
        if: steps.cache-sdl.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$SDL_TAG" https://github.com/libsdl-org/SDL.git /tmp/SDL
          cmake -S /tmp/SDL -B /tmp/SDL/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$SDL_PREFIX" \
            -DSDL_TEST_LIBRARY=OFF -DSDL_EXAMPLES=OFF
          ninja -C /tmp/SDL/build install

          git clone --depth 1 --branch "$SDL_IMAGE_TAG" https://github.com/libsdl-org/SDL_image.git /tmp/SDL_image
          cmake -S /tmp/SDL_image -B /tmp/SDL_image/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$SDL_PREFIX" \
            -DCMAKE_PREFIX_PATH="$SDL_PREFIX" \
            -DSDLIMAGE_SAMPLES=OFF -DSDLIMAGE_TESTS=OFF \
            -DSDLIMAGE_AVIF=OFF -DSDLIMAGE_WEBP=OFF -DSDLIMAGE_TIF=OFF -DSDLIMAGE_JXL=OFF
          ninja -C /tmp/SDL_image/build install

      - name: Cache CPM packages
        uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/CPM.cmake') }}

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_PREFIX_PATH="$SDL_PREFIX"
        env:
          PKG_CONFIG_PATH: ${{ env.SDL_PREFIX }}/lib/pkgconfig

      - name: Build
        run: ninja -C build

      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          LD_LIBRARY_PATH: ${{ env.SDL_PREFIX }}/lib
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy

  build-test-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Cache CPM packages
        uses: actions/cache@v4
        with:
          path: C:\cpm-cache
          key: cpm-windows-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/CPM.cmake') }}

      # No SDL3 packages or pkg-config on Windows: RAVEN_BUNDLED_DEPS builds
      # SDL3/SDL3_image from source via CPM alongside the other dependencies.
      # Visual Studio generators are multi-config, so the debug overlay's
      # default can't follow the build type: turn it off for Release here.
      - name: Configure
        run: >
          cmake -B build
          -DRAVEN_BUNDLED_DEPS=ON
          -DRAVEN_ENABLE_IMGUI=${{ matrix.build_type == 'Debug' && 'ON' || 'OFF' }}
          -DCPM_SOURCE_CACHE=C:\cpm-cache

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy

      # The package is what players get: the game, its DLLs and assets.
      - name: Check the package layout
        if: matrix.build_type == 'Release'
        shell: bash
        run: |
          cmake --install build --config Release --prefix pkg
          ls pkg
          test -f pkg/raven.exe
          test -f pkg/SDL3.dll
          test -f pkg/assets/data/config.json
          test ! -e pkg/include
